# ai-generated: 100% - temporary GitHub-hosted helper for the course receipt commands
name: lab5-operations

on:
  workflow_dispatch:
    inputs:
      task:
        description: One-time Lab 5 receipt operation
        required: true
        type: choice
        options:
          - submit-sarif
          - reveal-labels
          - submit-final
      issue:
        description: SARIF receipt issue number (reveal-labels only)
        required: false
        type: string
      tag:
        description: Submission tag (submit-final only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  course-tool:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the requested course command
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          TAG: ${{ inputs.tag }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          run_checker() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
              -e GH_TOKEN -e GITHUB_TOKEN \
              ghcr.io/swasik/itsmlab:2026 "$@"
          }

          case "$TASK" in
            submit-sarif)
              run_checker submit 5 --kind sarif
              ;;
            reveal-labels)
              if [[ ! "$ISSUE" =~ ^[0-9]+$ ]]; then
                echo "::error title=Missing receipt issue::provide the SARIF receipt issue number"
                exit 2
              fi
              mkdir -p bakeoff
              run_checker labels 5 --issue "$ISSUE" > bakeoff/labels.json
              python -m json.tool bakeoff/labels.json > /dev/null
              ;;
            submit-final)
              if [[ -z "$TAG" ]]; then
                echo "::error title=Missing submission tag::provide the pushed submission tag"
                exit 2
              fi
              run_checker submit 5 --kind submission --tag "$TAG"
              ;;
            *)
              echo "::error title=Unknown operation::unsupported task '$TASK'"
              exit 2
              ;;
          esac

      - name: Upload revealed labels
        if: inputs.task == 'reveal-labels'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labels
          path: bakeoff/labels.json
          if-no-files-found: error
